<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="favicon.svg"></head><body><title>Fluxo Girollar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: faixa navy + trilha de 4 etapas; à esquerda a etapa atual, à direita (ou barra fixa no celular) o resultado ao vivo */
:root{
  --navy:#172945; --navy-2:#2B4670; --red:#D32E22; --gold:#C2A24F;
  --ok:#1F8A4C; --warn:#B26F00; --bad:#C2281D;
  --bg:#FDFDFC; --surface:#FFFFFF; --surface-2:#F4F4F0; --line:#E2E2DC; --field:#D5D5CE;
  --fg:#1F2533; --muted:#5F6572; --soft:#868B96;
  --ok-bg:#E8F3EC; --warn-bg:#F8F1E0; --bad-bg:#FBE9E7; --info-bg:#EEF0F4;
  --band:#172945; --focus:#2B4670; color-scheme:light;
  --font:"Open Sans",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
  --head:"Montserrat",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#C9D6EA; --navy-2:#9DB4D6; --red:#E04A3D;
  --ok:#4CC27F; --warn:#E9A93A; --bad:#FF7A72;
  --bg:#0E1726; --surface:#152238; --surface-2:#1B2A44; --line:#2C3C58; --field:#3A4C6B;
  --fg:#E9EDF4; --muted:#A9B3C4; --soft:#7F8BA0;
  --ok-bg:#12301F; --warn-bg:#33270E; --bad-bg:#3A1716; --info-bg:#1B2A44;
  --focus:#9DB4D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#C9D6EA; --navy-2:#9DB4D6; --red:#E04A3D;
  --ok:#4CC27F; --warn:#E9A93A; --bad:#FF7A72;
  --bg:#0E1726; --surface:#152238; --surface-2:#1B2A44; --line:#2C3C58; --field:#3A4C6B;
  --fg:#E9EDF4; --muted:#A9B3C4; --soft:#7F8BA0;
  --ok-bg:#12301F; --warn-bg:#33270E; --bad-bg:#3A1716; --info-bg:#1B2A44;
  --focus:#9DB4D6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font-family:var(--font)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h2{font-size:21px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}

/* topo */
header.band{background:var(--band);color:#fff}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
header img{height:34px;width:auto}
header .ttl{margin-right:auto;line-height:1.25}
header .ttl b{display:block;font-size:16px;font-weight:600}
header .ttl span{font-size:12px;opacity:.75}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}

/* trilha de etapas */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 18px}
.stepper button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-width:0}
.stepper .bar{height:5px;background:var(--line)}
.stepper .lb{font-size:12.5px;font-weight:500;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper .lb i{font-style:normal;font-weight:600;color:var(--soft)}
.stepper button.done .bar{background:var(--navy-2)}
.stepper button.cur .bar{background:#D32E22}
.stepper button.cur{color:var(--fg)}
.stepper button.cur .lb i{color:#D32E22}
.stepname{display:none}
@media (max-width:560px){.stepper{margin-bottom:6px}.stepper .lb span{display:none}.stepname{display:block;font-size:13px;color:var(--muted);margin:0 0 14px}.stepname b{color:var(--fg);font-weight:600}header .ttl span{display:none}header img{height:28px}header .ttl b{font-size:15px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;padding-bottom:40px}
@media (max-width:940px){.layout{grid-template-columns:1fr;padding-bottom:110px}}

/* etapa */
.pane{background:var(--surface);border:1px solid var(--line);padding:22px 22px 20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.pane-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;font-weight:500;color:var(--fg)}
.f .hint{font-size:12px;color:var(--soft);line-height:1.4}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px var(--info-bg)}
.f textarea{min-height:110px;resize:vertical}
.f.req label::after{content:" *";color:var(--red)}
.f.miss input,.f.miss select{border-color:var(--warn)}
.money{position:relative}
.money input{padding-left:38px}
.money::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--soft);pointer-events:none}
.sugg{align-self:flex-start;border:0;background:var(--info-bg);color:var(--navy);font-size:12px;font-weight:500;padding:3px 10px;cursor:pointer}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice button b{font-size:14px;font-weight:600}
.choice button span{font-size:12px;color:var(--muted);line-height:1.35}
.choice button[aria-pressed="true"]{border-color:var(--navy-2);background:var(--info-bg)}
@media (max-width:480px){.choice{grid-template-columns:1fr}}
.box{background:var(--surface-2);padding:12px 14px;font-size:13px;color:var(--muted)}
.box b{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);padding:3px 10px;color:var(--muted);background:var(--surface)}
.chip b{color:var(--fg);font-weight:600}
.eq{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.eq span:nth-child(even){text-align:right}
.eq .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.sec-t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}

.extras{display:flex;flex-direction:column;gap:8px}
.extra{display:grid;grid-template-columns:minmax(0,2fr) 160px 150px 38px;gap:8px;align-items:center}
@media (max-width:600px){.extra{grid-template-columns:1fr 1fr}.extra>:first-child{grid-column:1/-1}.extra .x{justify-self:end;grid-column:2}}
.extra .money input{padding-left:38px}
.extra input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 11px;font-size:14px}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:#D32E22;border-color:#D32E22;color:#fff}
.btn.primary:hover{background:#B4261C;border-color:#B4261C}
.btn.navy{background:#172945;border-color:#172945;color:#fff}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C;color:#fff}
.btn.wa:hover{background:#18703D}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:13px}
.x{border:0;background:none;color:var(--soft);font-size:20px;cursor:pointer;width:38px;height:38px;}
.x:hover{background:var(--bad-bg);color:var(--bad)}

/* painel ao vivo */
aside.live{position:sticky;top:14px}
.card{background:var(--surface);border:1px solid var(--line);overflow:hidden}
.card-h{background:#172945;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h3{color:#fff}
.verdict{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
.verdict.ok{background:#1F8A4C}.verdict.bad{background:#D32E22}
.big{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.big span{font-size:12px;color:var(--muted)}
.big b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.big small{font-size:12.5px;color:var(--muted)}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;font-size:13.5px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.rows span:nth-child(even){text-align:right;font-weight:500}
.alerts{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.alert{padding:9px 12px;font-size:13px;line-height:1.4}
.alert b{display:block;font-weight:600;margin-bottom:1px}
.alert.bad{background:var(--bad-bg)} .alert.bad b{color:var(--bad)}
.alert.ok{background:var(--ok-bg)} .alert.ok b{color:var(--ok)}
.alert.info{background:var(--info-bg)} .alert.info b{color:var(--navy)}
.alert .fix{display:block;margin-top:4px;color:var(--fg)}
.meter{padding:0 16px 14px}
.meter .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.meter .track{height:8px;background:var(--surface-2);position:relative;overflow:hidden}
.meter .track i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.meter.bad .track i{background:var(--bad)}
.meter .track u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.55}
.empty-live{padding:22px 16px;color:var(--muted);font-size:13.5px}

/* barra fixa no celular */
.dock{display:none}
@media (max-width:940px){
  aside.live{display:none}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center}
  .dock .d1{flex:1;min-width:0;line-height:1.25}
  .dock .d1 span{font-size:11.5px;color:var(--muted)}
  .dock .d1 b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .dock .dot{border-radius:50%;width:10px;height:10px;background:var(--soft);flex:none}
  .dock .dot.ok{background:var(--ok)} .dock .dot.bad{background:var(--bad)}
}

/* revisão */
.proposal{border:1px solid var(--line);overflow:hidden;container-type:inline-size}
.prop-h{background:#172945;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.prop-h small{opacity:.75;font-size:12px;display:block}
.prop-h b{font-size:18px;font-weight:600}
.prop-h .r{text-align:right}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));border-bottom:1px solid var(--line)}
.facts div{padding:12px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.facts div:last-child{border-right:0}
.facts span{font-size:11.5px;color:var(--muted)}
.facts b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@container (max-width:660px){.phases{grid-template-columns:1fr}.phase{border-right:0;border-bottom:1px solid var(--line)}.phase:last-child{border-bottom:0}}
.phase{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.phase:last-child{border-right:0}

.phase .when{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#D32E22}
.phase h3{font-size:14px}
.phase .main{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.phase .main small{font-size:12.5px;font-weight:400;color:var(--muted);display:block}
.phase ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.phase li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.phase li span:first-child{color:var(--muted)}
.prop-f{padding:12px 18px;background:var(--surface-2);font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.send{display:flex;flex-wrap:wrap;gap:10px}
.send .btn{flex:1;min-width:200px}
details.proj{border:1px solid var(--line);}
details.proj summary{cursor:pointer;padding:12px 16px;font-weight:500;font-size:14px}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:#172945;color:#fff;font-weight:500;text-align:right;padding:9px 12px;white-space:nowrap;font-size:12px}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td{padding:7px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tr.keys td{background:var(--info-bg)} tr.sinal td{background:var(--surface-2);font-weight:500}
tr.tot td{font-weight:600;background:var(--surface-2)}
td.z{color:var(--soft)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;padding:1px 6px;margin-left:6px;background:#172945;color:#fff}
.docbox{border:2px solid var(--navy-2);padding:14px;display:flex;flex-direction:column;gap:10px}
.docbox .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.docbox .dh b{font-size:15px;font-weight:600}
.docbox .hint{font-size:12px;color:var(--muted)}
.docbox .choice button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--navy-2)}
.docbox .choice button[aria-pressed="true"] b::before{content:"✓ "}
.docbadge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 12px;white-space:nowrap}
.docbadge.in{background:var(--ok-bg);color:var(--ok)}
.docbadge.out{background:var(--warn-bg);color:var(--warn)}
.prop-h .docbadge.in{background:#fff;color:#172945}
.prop-h .docbadge.out{background:#D32E22;color:#fff}
.f input[readonly]{background:var(--surface-2);color:var(--muted)}
.linkbtn{align-self:flex-start;border:0;background:none;color:var(--navy);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;margin-top:18px;padding:30px 20px;border:2px dashed var(--navy-2);background:var(--surface);cursor:pointer}
.drop b{font-size:15px;font-weight:600}
.drop span{font-size:12.5px;color:var(--muted);max-width:60ch}
.drop.over{background:var(--info-bg);border-style:solid}
.imgp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line);padding:12px}
.imgp img{width:100%;border:1px solid var(--line);max-height:220px;object-fit:cover;object-position:top}
.imgp p{margin:0 0 10px;font-size:13.5px}
.imgp .acts{display:flex;flex-wrap:wrap;gap:8px}
.diff{margin:0;padding-left:18px;font-size:13px}
.teo{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 14px;font-size:12.5px;line-height:1.45}

/* condições (editores) */
.conds{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.cond-card{background:var(--surface);border:1px solid var(--line);padding:16px}
.cond-card h3{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
.cond-card .grid{grid-template-columns:1fr 1fr;gap:10px}
.cond-card .f input{padding:8px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.btn,.choice button,.stepper .bar{transition:background .15s,border-color .15s}}

/* linguagem do site girollar.com.br: cantos retos, Montserrat em títulos e rótulos, faixas navy, filetes finos */
h2,h3,.btn,.hbtn,.f label,.sec-t,.chip,.verdict,.docbadge,.tag,th,.stepper,.stepname,.facts span,.when,.big b,.phase .main,.prop-h b,.dock .d1 b,.eq .tot{font-family:var(--head)}
h2{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.eye{display:block;font:600 10.5px var(--head);letter-spacing:2.2px;text-transform:uppercase;color:var(--muted)}
.eye::after{content:"";display:block;width:34px;height:2px;background:var(--red);margin:9px 0 13px}
.pane-h p{font-size:14px;line-height:1.6;margin-top:8px}
header.band{border-bottom:1px solid rgba(251,250,249,.1)}
header .wrap{padding-block:14px;gap:20px}
header img{height:42px}
header .ttl{padding-left:20px;border-left:1px solid rgba(251,250,249,.18)}
header .ttl b{font:600 11.5px var(--head);letter-spacing:2.4px;text-transform:uppercase}
header .ttl span{font-size:12px;color:rgba(251,250,249,.6);opacity:1}
.hbtn{background:none;padding:10px 4px;font-size:10.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(251,250,249,.65)}
.hbtn:hover{background:none;color:#fff}
#hNovo{background:#D32E22;color:#fff;padding:11px 18px;font-weight:700}
#hNovo:hover{background:#B4261C}
.stepper{gap:0;margin:30px 0 26px}
.stepper button{gap:9px;padding-right:12px}
.stepper .bar{height:2px}
.stepper .lb{font-size:10.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase}
.stepper button.done .bar{background:var(--navy)}
.stepper button.cur .bar{background:var(--red);height:3px}
.stepper .lb i{color:var(--soft)}
.stepname{font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.layout{gap:34px}
.pane{border:1px solid var(--line);padding:32px 32px 26px;gap:22px}
.f label{font-size:10.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase}
.f input,.f select,.f textarea{padding:12px 13px;border-color:var(--field)}
.f .money input{padding-left:40px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy-2)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.sec-t{font-size:10.5px;letter-spacing:2.2px;border-top:1px solid var(--line);padding-top:18px;margin:6px 0 -8px}
.choice button{padding:14px 16px;border-width:1px;gap:3px}
.choice button b{font:700 13px var(--head)}
.choice button[aria-pressed="true"]{background:var(--band);border-color:var(--navy-2);color:#fff}
.choice button[aria-pressed="true"] span{color:rgba(251,250,249,.72)}
.docbox{border:1px solid var(--line);border-left:3px solid var(--red);padding:18px}
.docbox .dh b{font:700 13.5px var(--head)}
.docbox .choice button[aria-pressed="true"]{box-shadow:none}
.docbadge{font-size:10px;font-weight:700;letter-spacing:1.4px;padding:5px 11px}
.docbadge.in{background:var(--band);color:#fff}
.docbadge.out{background:var(--red);color:#fff}
.box{background:var(--surface-2)}
.sugg{background:none;padding:0;color:var(--navy-2);text-decoration:underline}
.chip{font-size:11px;font-weight:500;background:none;padding:4px 10px}
.btn{font-size:11.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;padding:15px 24px}
.btn.primary{background:#D32E22;border-color:#D32E22}
.btn.primary:hover{background:#B4261C;border-color:#B4261C}
.btn.navy{background:var(--band);border-color:var(--navy-2)}
.btn.ghost{padding-inline:6px}
.btn.sm{padding:10px 14px;font-size:10.5px}
.nav{padding-top:20px}
/* resultado: bloco navy, como as seções escuras do site */
.card{background:var(--band);border:1px solid var(--band);color:#FBFAF9}
.card-h{background:none;padding:16px 20px;border-bottom:1px solid rgba(251,250,249,.13)}
.card-h h3{font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:rgba(251,250,249,.75)}
.verdict{font-size:9.5px;letter-spacing:1.3px;background:rgba(251,250,249,.13)}
.verdict.ok{background:#1F8A4C}.verdict.bad{background:var(--red)}
.big{padding:20px 20px 16px;border-bottom:1px solid rgba(251,250,249,.13)}
.big span,.big small{color:rgba(251,250,249,.62)}
.big b{font-size:31px;font-weight:700;color:#fff}
.rows{padding:14px 20px;border-bottom:1px solid rgba(251,250,249,.13);font-size:13px}
.rows span{color:rgba(251,250,249,.72)}
.rows span:nth-child(even){color:#fff;font-weight:600}
.rows .docbadge.in{background:#FBFAF9;color:var(--band)}
.meter{padding:0 20px 16px}
.meter .t{color:rgba(251,250,249,.62)}
.meter b{color:#fff!important}
.meter .track{background:rgba(251,250,249,.14)}
.meter .track i{background:var(--gold)}
.meter.bad .track i{background:var(--red)}
.meter .track u{background:#fff;opacity:.8}
.card .alerts{padding:14px 20px 18px}
.card .alert{background:rgba(251,250,249,.08);color:rgba(251,250,249,.82)}
.card .alert.ok b{color:#8ED6AC}.card .alert.bad b{color:#FF9B91}
.card .alert .fix{color:#fff}
.empty-live{color:rgba(251,250,249,.7);padding:24px 20px}
.alert{border-left:3px solid var(--line)}
.alert.ok{border-left-color:var(--ok)}.alert.bad{border-left-color:var(--bad)}.alert.info{border-left-color:var(--navy)}
/* revisão */
.prop-h{padding:20px 24px}
.prop-h small{font:600 10px var(--head);letter-spacing:1.8px;text-transform:uppercase;opacity:.65;margin-bottom:3px}
.prop-h b{font-weight:700}
.facts{grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.facts div{padding:14px 20px;background:var(--surface);border:0}
.facts div:nth-child(5):last-child{grid-column:span 2}
.facts div:nth-child(7):last-child{grid-column:span 3}
.facts div:nth-child(8):last-child{grid-column:span 2}
.facts span{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px}
.facts b{font:700 15px var(--head)}
.phase{padding:20px 22px}
.phase .when{font-size:10px;letter-spacing:1.5px;color:var(--red)}
.phase h3{font-size:13px;font-weight:600}
.phase .main{font-size:23px;font-weight:700}
.phase .main small{font-family:var(--font)}
th{font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;background:var(--band)}
details.proj summary{font:600 12px var(--head);letter-spacing:.4px}
.teo{border-left-color:var(--gold)}
/* barra do celular */
@media (max-width:940px){
  .dock{background:var(--band);border-top:0;color:#fff}
  .dock .d1 span{color:rgba(251,250,249,.65)}
  .dock .d1 b{color:#fff;font-weight:700}
}
/* mais e menos, atalhos, blocos recolhidos, situação no celular */
.stp{display:grid;grid-template-columns:52px minmax(0,1fr) 52px}
.stp button{border:1px solid var(--field);background:var(--surface-2);color:var(--fg);font:600 22px var(--head);cursor:pointer;min-height:48px;border-radius:0}
.stp button:hover{border-color:var(--navy-2)}
.f .stp input{text-align:center;font:700 20px var(--head);border-inline:0;padding-inline:4px;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:none;color:var(--muted);font:600 12px var(--head);padding:7px 10px;min-width:46px;cursor:pointer}
.quick button[aria-pressed="true"]{background:var(--band);border-color:var(--navy-2);color:#fff}
details.more{border:1px solid var(--line)}
details.more summary{cursor:pointer;padding:13px 16px;font:600 12px var(--head);letter-spacing:.4px}
details.more .in{padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px}
.send{flex-direction:column}
.send .btn.wa{padding-block:19px;font-size:12.5px}
.send details.more .in{flex-direction:row;flex-wrap:wrap}
.send details.more .btn{min-width:160px}
.dock .d1{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}
.dock .d1 span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .d1.bad span{color:#FF9B91}.dock .d1.ok span{color:#8ED6AC}
.sheet{position:absolute;left:0;right:0;bottom:100%;background:var(--surface);color:var(--fg);border-top:3px solid var(--gold);box-shadow:0 -12px 30px rgba(0,0,0,.22);max-height:62vh;overflow:auto}
.sheet[hidden]{display:none}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
.sheet .sh b{font:700 11px var(--head);letter-spacing:1.6px;text-transform:uppercase}
.sheet .sh button{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px}
.sheet .rows{border-bottom:0;padding-bottom:4px}
.sheet .rows,.sheet .rows span{color:var(--fg)}
@media (max-width:560px){
  .pane{padding:22px 18px 18px}
  h2{font-size:23px}
  header .wrap{gap:10px;padding-block:10px}
  header img{height:30px}
  header .ttl{display:none}
  header #hNovo{margin-left:auto;padding:9px 12px;font-size:9.5px;letter-spacing:1.3px}
  header .hbtn:not(#hNovo){font-size:9.5px;letter-spacing:1.2px}
  .stepper{margin:18px 0 8px}
  .stepname{display:none}
  .stepper{margin-bottom:16px}
  .prop-h .r{text-align:left}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div{padding:12px 14px}
  .facts div:nth-child(5):last-child,.facts div:nth-child(7):last-child{grid-column:span 2}
}
.modes{display:flex;margin:24px 0 0;border:1px solid var(--field);width:max-content;max-width:100%}
.modes button{border:0;background:none;color:var(--muted);font:700 11px var(--head);letter-spacing:1.6px;text-transform:uppercase;padding:13px 22px;cursor:pointer;border-radius:0}
.modes button[aria-pressed="true"]{background:var(--band);color:#fff}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:34px;align-items:start;padding:22px 0 60px}
.cform{display:flex;flex-direction:column;gap:18px}
.cres{position:sticky;top:14px}
.cres .go{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.cbar{display:none}
@media (max-width:940px){.cgrid{grid-template-columns:1fr;padding-bottom:110px}.cres{position:static}
  .cbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--band);color:#fff;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .cbar .c1{flex:1;min-width:0;line-height:1.25;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}
  .cbar .c1 span{display:block;font-size:11.5px;color:rgba(251,250,249,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cbar .c1 b{display:block;font:700 19px var(--head);font-variant-numeric:tabular-nums}
  .cbar .c1.bad span{color:#FF9B91}.cbar .c1.ok span{color:#8ED6AC}}
.ib{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border:1px solid var(--navy-2);border-radius:50%;background:none;color:var(--navy-2);font:700 11px/1 var(--head);text-transform:none;letter-spacing:0;cursor:pointer;vertical-align:1px;padding:0}
.ib:hover,.ib[aria-expanded="true"]{background:var(--navy-2);color:var(--bg)}
.infobox{background:var(--info-bg);border-left:3px solid var(--navy-2);padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--fg)}
.infobox a{display:inline-block;margin-top:4px;font-weight:600;color:var(--navy)}
</style>

        <div class="grid">
          <div class="f req"><label for="cliente">Nome do cliente</label><input id="cliente" autocomplete="off" placeholder="Nome completo"></div>
          <div class="f req"><label for="renda">Renda bruta familiar</label><div class="money"><input id="renda" inputmode="decimal" data-money placeholder="0,00"></div></div>
          <div class="f"><label for="corretor">Corretor</label><input id="corretor" autocomplete="name" placeholder="Seu nome"></div>
          <div class="f"><label for="imob">Imobiliária</label><input id="imob" autocomplete="organization" placeholder="Nome da imobiliária"></div>
        </div>
        <div class="f"><label>O cliente terá avalista?</label>
          <div class="choice">
            <button type="button" id="av-com" aria-pressed="true"><b>Sim, com avalista</b><span>Avalista com até 60 anos e renda de 3× a parcela da Girollar.</span></button>
            <button type="button" id="av-sem" aria-pressed="false"><b>Não, sem avalista</b><span>Máximo de 36 mensais, de até 30% da renda.</span></button>
          </div></div>
        <div class="nav"><span></span><button class="btn primary" type="button" data-next>Continuar</button></div>
      </section>

      <!-- ETAPA 2 -->
      <section class="pane" data-step="1" hidden>
        <div class="pane-h"><span class="eye">Etapa 2 · Imóvel e Caixa</span><h2>Imóvel e financiamento</h2><p>Escolha a unidade: valor de tabela e avaliação vêm da última tabela de vendas. O financiamento sai do simulador da Caixa, usando sempre o <b>valor de avaliação</b> como valor do imóvel.</p></div>
        <div class="grid">
          <div class="f req"><label for="emp">Empreendimento</label><select id="emp"></select></div>
          <div class="f" id="fBloco" hidden><label for="bloco">Bloco</label><select id="bloco"></select></div>
          <div class="f" id="fUnid" hidden><label for="unidSel">Unidade disponível</label><select id="unidSel"></select></div>
          <div class="f" id="fUnidTxt"><label for="unidade">Unidade e torre</label><input id="unidade" autocomplete="off" placeholder="Ex.: 905 Torre II"></div>
        </div>
        <button type="button" class="linkbtn" id="toManual" hidden></button>
        <div class="chips" id="empChips"></div>
        <div class="grid">
          <div class="f req"><label for="tabela">Valor de tabela</label><div class="money"><input id="tabela" inputmode="decimal" data-money placeholder="0,00"></div></div>
          <div class="f req"><label for="avaliacao">Valor de avaliação</label><div class="money"><input id="avaliacao" inputmode="decimal" data-money placeholder="0,00"></div><span class="hint" id="difHint"></span></div>
        </div>
        <div class="sec-t">Simulador da Caixa</div>
        <div class="grid">
          <div class="f req"><label for="financ">Financiamento aprovado <button type="button" class="ib" data-info="infoFin" aria-label="Como simular o financiamento na Caixa" aria-expanded="false">i</button></label><div class="money"><input id="financ" inputmode="decimal" data-money placeholder="0,00"></div><div class="infobox" id="infoFin" hidden>Ainda não fez a simulação? Faça no site da Caixa e volte aqui com o valor do financiamento. <a href="https://simuladorhabitacao.caixa.gov.br/simulacao" target="_blank" rel="noopener">Abrir o simulador da Caixa</a></div></div>
          <div class="f"><label for="pcaixa">Parcela da Caixa</label><div class="money"><input id="pcaixa" inputmode="decimal" data-money placeholder="0,00"></div><span class="hint">Só para registro; não entra no parcelamento Girollar</span></div>
          <div class="f"><label for="subsidio">Subsídio</label><div class="money"><input id="subsidio" inputmode="decimal" data-money placeholder="0,00"></div><span class="hint">Só se enquadrar na Faixa 2 do MCMV</span></div>
          <div class="f"><label for="fgts">FGTS</label><div class="money"><input id="fgts" inputmode="decimal" data-money placeholder="0,00"></div><span class="hint">Se o cliente for usar</span></div>
        </div>
        <div class="nav"><button class="btn ghost" type="button" data-prev>Voltar</button><button class="btn primary" type="button" data-next>Continuar</button></div>
      </section>

      <!-- ETAPA 3 -->
      <section class="pane" data-step="2" hidden>
        <div class="pane-h"><span class="eye">Etapa 3 · Entrada e datas</span><h2>Como o cliente paga a entrada</h2><p>A diferença até o valor de tabela é parcelada com a Girollar em mensais e reforços anuais.</p></div>
        <div class="box eq" id="eqBox"></div>
        <div class="grid">
          <div class="f"><label for="sinal">Sinal</label><div class="money"><input id="sinal" inputmode="decimal" data-money placeholder="0,00"></div><span class="hint" id="sinalHint"></span></div>
        </div>
        <div class="docbox"><div class="dh"><b>Documentação (ITBI, registro e taxa de contrato)</b><span class="docbadge in" id="docBadge"></span></div>
          <div class="choice">
            <button type="button" id="doc-sim" aria-pressed="true"><b>Com documentação inclusa</b><span id="docSimTxt">4% da tabela somado ao parcelamento.</span></button>
            <button type="button" id="doc-nao" aria-pressed="false"><b>Sem documentação</b><span>Cliente paga à vista, fora do parcelamento. Ajuda quando o limite estoura.</span></button>
          </div>
          <span class="hint">Não inclui despachante bancário, certidões e certificado digital.</span></div>
        <div class="sec-t">Mensais</div>
        <div class="grid">
          <div class="f"><label for="nMensais">Quantidade de mensais</label><div class="stp"><button type="button" data-stp="nMensais" data-d="-1" aria-label="Menos uma mensal">−</button><input id="nMensais" type="number" min="1" step="1" inputmode="numeric"><button type="button" data-stp="nMensais" data-d="1" aria-label="Mais uma mensal">+</button></div><div class="quick" id="mensQuick"></div><span class="hint" id="mensMax"></span></div>
          <div class="f"><label for="dMensal">Vencimento da 1ª mensal</label><input id="dMensal" type="date"><span class="hint" id="mensalHint"></span></div>
        </div>

        <div class="grid">
          <div class="f"><label for="nRef">Quantidade de reforços</label><div class="stp"><button type="button" data-stp="nRef" data-d="-1" aria-label="Menos um reforço">−</button><input id="nRef" type="number" min="0" step="1" inputmode="numeric"><button type="button" data-stp="nRef" data-d="1" aria-label="Mais um reforço">+</button></div><span class="hint" id="refMax"></span></div>
          <div class="f" id="fVRef"><label for="vRef">Valor de cada reforço</label><div class="money"><input id="vRef" inputmode="decimal" data-money placeholder="0,00"></div><button type="button" class="sugg" id="refSugg"></button></div>
          <div class="f" id="fDRef"><label for="dRef">Vencimento do 1º reforço</label><input id="dRef" type="date"><span class="hint">Os demais no mesmo dia, a cada 12 meses</span></div>
        </div>

        <div class="extras" id="extras"></div>
        <div><button type="button" class="btn sm" id="addExtra">+ Adicionar vencimento</button> <span class="small muted">ITBI, registro, assinatura, validade da proposta…</span></div></div></details>

      <!-- ETAPA 4 -->
      <section class="pane" data-step="3" hidden>
        <div class="pane-h"><span class="eye">Etapa 4 · Revisar e enviar</span><h2>Revise com o cliente</h2><p>Este é o resumo que vai para a Girollar. Confira os alertas antes de enviar.</p></div>

          <button class="btn wa" id="btnImg" type="button">Enviar imagem pelo WhatsApp</button>

          </div></details>
        </div>
        <details class="proj"><summary>Ver parcelas Girollar mês a mês (projeção teórica)</summary>

function go(n){
  if(n>step){document.querySelectorAll(`[data-step="${step}"] .f.req`).forEach(f=>f.dataset.tried="1")}
  step=Math.max(0,Math.min(3,n));$("sheet").hidden=true;
  document.querySelectorAll("[data-step]").forEach(p=>p.hidden=+p.dataset.step!==step);
  const NM=["Cliente","Imóvel e Caixa","Entrada e datas","Revisar e enviar"];$("stepName").innerHTML="Etapa "+(step+1)+" de 4 · <b>"+NM[step]+"</b>";
  document.querySelectorAll("#stepper button").forEach((b,i)=>{b.classList.toggle("cur",i===step);b.classList.toggle("done",i<step);b.setAttribute("aria-current",i===step?"step":"false")});
  render();window.scrollTo({top:0,behavior:"smooth"});
}

$("bloco").addEventListener("change",()=>{sel={b:$("bloco").value,u:""};syncUnit();render()});
$("unidSel").addEventListener("change",()=>{sel.u=$("unidSel").value;syncUnit();render()});
$("toManual").onclick=()=>{manual=!manual;if(!manual)sel={b:"",u:""};syncUnit();render()};
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(step+1));
document.querySelectorAll("[data-prev]").forEach(b=>b.onclick=()=>go(step-1));
document.querySelectorAll("#stepper button").forEach(b=>b.onclick=()=>go(+b.dataset.go));

  if(b&&last){const i=$(b.dataset.stp),d=+b.dataset.d,mx=b.dataset.stp==="nMensais"?last.r.maxM:last.r.e.maxReforcos,v=(parseInt(i.value)||0)+d;i.value=Math.max(+i.min||0,d>0?Math.min(mx,v):v);render()}

/* atualizar tabelas (editores): lê os arquivos, mostra o que muda e republica a página com os dados novos */
let pend=[];
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const OBRA_KEYS={firenze:["firenze","napoles","scharf"],milao:["milao","zimmermann"],veneto:["veneto","jorge lacerda"],florenca:["florenca"],trento:["trento"]};
function guessEmp(t){t=norm(t);const ach=CONF.empreendimentos.filter(e=>(OBRA_KEYS[e.id]||[norm(e.nome)]).some(k=>t.includes(k)));return ach.length===1?ach[0].id:""} // citou duas obras: deixa o editor escolher
const UNI_RE=/^(\d{2,4})\s+(?:(bloco|torre)\s+([0-9a-z]+)|([a-z]))(?:\s|$)/i; // "108 BLOCO 01 SUÍTE COBERTA 13", "1301 BLOCO 1 - área Garden", "101 A"
const uniDe=s=>{const m=String(s??"").trim().match(UNI_RE);return m?{u:m[1],b:m[4]?"Bloco "+m[4]:m[2]+" "+m[3]}:null};
const blocoNome=s=>{const m=String(s).trim().match(/^(bloco|torre)\s+(\S+)$/i);return m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+" "+m[2].toUpperCase():String(s).trim()};
function dataDe(t){const m=norm(t).match(/(?:emissao|emitid\w* em|posicao de|fonte)[^\d]{0,60}(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:""}
function addUni(p,b,u,tab,av){if(!(tab>0&&av>0)){p.ign++;return}const k=blocoNome(b);p.blocos[k]=(p.blocos[k]||[]).filter(x=>x[0]!==String(u));p.blocos[k].push([String(u),tab,av])}
function novoPend(nome,texto,aba){return{fonte:nome,emp:guessEmp(aba)||guessEmp(nome)||guessEmp(texto),data:dataDe(texto),blocos:{},ign:0,err:""}}
function fechaPend(p){const n=Object.values(p.blocos).reduce((a,x)=>a+x.length,0);if(!n&&!p.err)p.err="Não encontrei unidades com valor e avaliação neste arquivo. Use a Tabela de Preços do sistema (a tabela enviada aos corretores não traz avaliação).";Object.values(p.blocos).forEach(x=>x.sort((a,b)=>natural(a[0],b[0])));if(!p.data){const m=p.fonte.match(/(\d{2})-(\d{2})(?:\D|$)/);if(m)p.data=`${today().getFullYear()}-${m[2]}-${m[1]}`;else{p.semData=true;p.data=iso(today())}}return p}
function lerLinhas(rows,nome,aba){
  const texto=rows.slice(0,12).map(r=>r.join(" ")).join(" ");const p=novoPend(nome,texto,aba);
  for(let i=0;i<Math.min(rows.length,15);i++){
    const c=rows[i].map(norm),av=c.indexOf("avaliacao"),v100=c.indexOf("r$ 100%"),uni=c.indexOf("unidade"),sit=c.indexOf("situacao");
    if(av>=0&&uni>=0&&sit>=0){ // planilha organizada: uma coluna por campo
      const bl=c.indexOf("bloco"),v2=c.indexOf("valor r$ atualizado"),v1=c.indexOf("valor r$");if(bl<0||v1<0)continue;
      rows.slice(i+1).forEach(r=>{if(!/^\d+$/.test(String(r[uni]??"").trim())||norm(r[sit])!=="disponivel")return;addUni(p,r[bl],String(r[uni]).trim(),parseMoney(r[v2])||parseMoney(r[v1]),parseMoney(r[av]))});
      return fechaPend(p)}
    if(av>=0&&v100>=0){ // Tabela de Preços do sistema: só traz o que está disponível
      rows.slice(i+1).forEach(r=>{const m=r.map(uniDe).find(Boolean);if(m)addUni(p,m.b,m.u,parseMoney(r[v100]),parseMoney(r[av]))});
      return fechaPend(p)}
  }
  return null;
}
async function lerPlanilha(f){
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=window.XLSX.read(await f.arrayBuffer());
  const out=wb.SheetNames.map(n=>lerLinhas(window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}),wb.SheetNames.length>1?f.name+" · "+n:f.name,n)).filter(Boolean);
  return out.length?out:[fechaPend(novoPend(f.name,""))];
}
async function lerPdf(f){
  await loadJs("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const d=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  let col=null,linha=0,cA=0,cV=0,cU=0;const pgs=[];
  for(let n=1;n<=d.numPages;n++){const pg=await d.getPage(n);pgs.push((await pg.getTextContent()).items.filter(i=>i.str.trim()))}
  const p=novoPend(f.name,pgs.flat().slice(0,40).map(i=>i.str).join(" "));
  const dinheiro=/^\d{1,3}(\.\d{3})*,\d{2}$/;
  pgs.forEach(its=>{
    const a=its.find(i=>norm(i.str)==="avaliacao"),v=its.find(i=>norm(i.str)==="r$ 100%"),u=its.find(i=>norm(i.str)==="apartamento");
    if(a&&v&&u){col=Math.abs(a.transform[4]-v.transform[4])>Math.abs(a.transform[5]-v.transform[5])?4:5;linha=col===4?5:4;cA=a.transform[col];cV=v.transform[col];cU=u.transform[col]} // o relatório sai girado: a coluna pode estar em x ou y
    if(col===null)return;
    const emOrdem=l=>l.sort((x,y)=>x.transform[linha]-y.transform[linha]);
    const unis=emOrdem(its.filter(i=>Math.abs(i.transform[col]-cU)<45&&uniDe(i.str)));
    const naCol=c=>emOrdem(its.filter(i=>Math.abs(i.transform[col]-c)<40&&dinheiro.test(i.str.trim())));
    const vs=naCol(cV),as=naCol(cA);if(!vs.length&&!as.length)return; // página sem valores, como o quadro de gardens
    const valor=(lst,i,uni)=>{if(lst.length===unis.length)return parseMoney(lst[i].str); // linhas altas desalinham a célula: com a mesma contagem, vale a ordem
      const o=lst.slice().sort((x,y)=>Math.abs(x.transform[linha]-uni.transform[linha])-Math.abs(y.transform[linha]-uni.transform[linha]))[0];return o&&Math.abs(o.transform[linha]-uni.transform[linha])<6?parseMoney(o.str):0};
    unis.forEach((x,i)=>{const m=uniDe(x.str);addUni(p,m.b,m.u,valor(vs,i,x),valor(as,i,x))})});
  return[fechaPend(p)];
}
function mergeTab(){
  const t=JSON.parse(JSON.stringify(TAB)),vistos=new Set();
  pend.filter(p=>p.emp&&!p.err).forEach(p=>{const o=t.obras[p.emp]=t.obras[p.emp]||{blocos:{}};
    Object.entries(p.blocos).forEach(([b,u])=>{const k=p.emp+"|"+b; // a tabela anterior do bloco sai inteira
      const cur=o.blocos[b];if(vistos.has(k)&&cur.d>p.data)return; // entre arquivos do mesmo bloco, vale o mais novo
      if(vistos.has(k)&&cur.d===p.data)o.blocos[b]={d:p.data,u:[...cur.u.filter(x=>!u.some(y=>y[0]===x[0])),...u].sort((x,y)=>natural(x[0],y[0]))};else o.blocos[b]={d:p.data,u};vistos.add(k)})});
  return t}
function difObra(id,nova){
  const de=TAB.obras[id]?TAB.obras[id].blocos:{},r={preco:[],aval:[],sai:[],entra:[]};
  Object.entries(nova.blocos).forEach(([b,x])=>{const antes=de[b];if(!antes)return;
    const ant=new Map(antes.u.map(u=>[u[0],u])),nov=new Map(x.u.map(u=>[u[0],u]));
    x.u.forEach(u=>{const o=ant.get(u[0]);if(!o)r.entra.push(u[0]+" "+b);else{if(o[1]!==u[1])r.preco.push(`${u[0]} ${b}: ${brl0(o[1])} → ${brl0(u[1])}`);if(o[2]!==u[2])r.aval.push(`${u[0]} ${b}: ${brl0(o[2])} → ${brl0(u[2])}`)}});
    antes.u.forEach(u=>{if(!nov.has(u[0]))r.sai.push(u[0]+" "+b)})});
  return r}
function renderTabView(){
  $("tabNow").innerHTML=CONF.empreendimentos.map(e=>{const bl=blocosOf(e.id);return`<div class="cond-card"><h3>${esc(e.nome)}</h3>${bl.length?bl.map(b=>{const x=TAB.obras[e.id].blocos[b];return`<div class="small">${esc(b)}: <b>${x.u.length}</b> disponíveis, tabela de ${fmtD(pd(x.d))}</div>`}).join(""):'<div class="small muted">Sem tabela: o corretor digita os valores.</div>'}</div>`}).join("");

    h+=`<div class="cond-card"><h3>O que muda em ${esc(empById(id).nome)}</h3>${it?`<ul class="diff">${it}</ul>`:`<p class="small muted" style="margin:0">Primeira tabela desta obra, ou nenhuma mudança.</p>`}</div>`});
  if(validos.length)h+=`<div><button class="btn navy" id="tabPub" type="button"${falta?" disabled":""}>Publicar para os corretores</button>${falta?' <span class="small muted">Escolha a obra de cada arquivo.</span>':""}</div>`;

const TAB_EXT=/\.(pdf|xlsx|xls|csv)$/i;
const lerPasta=dir=>new Promise((ok,ko)=>{const r=dir.createReader(),tudo=[];const lote=()=>r.readEntries(l=>{if(!l.length)return ok(tudo);tudo.push(...l);lote()},ko);lote()});
async function daEntrada(ent,nivel,out){

  return{...blank(),emp:$("c_emp").value,unidade:un,renda:g("renda"),tabela:g("tabela"),avaliacao:g("avaliacao")||g("tabela"),financ:g("financ"),fgts:g("fgts"),sinal:g("sinal"),vRef:g("vRef"),nMensais:Math.max(0,parseInt($("c_nMensais").value)||0),nRef:Math.max(0,parseInt($("c_nRef").value)||0),avalista:cav,docParc:cdoc,refTouched:cRefTouched,sel:{...csel},manual:!csel.u,calc:true}}
function cRender(){
  if(!cRefTouched){const r0=parseMoney($("c_renda").value);$("c_vRef").value=r0?num(Math.round(r0/2*100)/100):""}
  const s=cState(),r=compute(s),e=r.e,ok=s.tabela>0&&!!s.emp;
  $("c_fVRef").hidden=!s.nRef;
  $("c_sinalHint").textContent=e.sinalMin&&s.emp?"Mínimo de "+brl0(e.sinalMin)+" neste empreendimento":"";
  $("c_refMax").textContent="Máximo "+e.maxReforcos;
  $("c_vRefHint").textContent=s.renda?"Sugerido: "+brl(s.renda/2)+" (50% da renda)":"";
  $("c_avSub").textContent="Até "+e.maxMensais+" mensais.";
  const qs=[];for(let q=12;q<=r.maxM;q+=12)qs.push(q);if(qs[qs.length-1]!==r.maxM)qs.push(r.maxM);
  $("c_quick").innerHTML=qs.map(q=>'<button type="button" data-cq="'+q+'" aria-pressed="'+(q===s.nMensais)+'">'+q+"×</button>").join("");
  $("c_chips").innerHTML=s.emp?'<span class="chip">Entrega <b>'+fmtD(r.entrega)+'</b></span><span class="chip">Parcelamento até <b>'+pct(e.risco,0)+'</b> da tabela</span><span class="chip">Até <b>'+r.maxM+'</b> mensais</span><span class="chip">Até <b>'+e.maxReforcos+'</b> reforços</span>':"";
  document.querySelectorAll("[data-cdoc]").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.cdoc==="1")===cdoc));
  document.querySelectorAll("[data-cav]").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.cav==="1")===cav));
  const alerts=r.al.map(a=>'<div class="alert '+a.st+'"><b>'+esc(a.t)+"</b>"+esc(a.d)+'<span class="fix">→ '+esc(a.fix)+"</span></div>").join("")||'<div class="alert ok"><b>Tudo dentro das regras</b>Pode levar para a simulação.</div>';
  let h='<div class="card"><div class="card-h"><h3>Resultado</h3>'+(ok?(r.bad?'<span class="verdict bad">'+(r.al.length===1?"1 ajuste":r.al.length+" ajustes")+"</span>":'<span class="verdict ok">Dentro das regras</span>'):'<span class="verdict">Em preenchimento</span>')+"</div>";
  if(!ok)h+='<div class="empty-live">Escolha o <b>empreendimento</b> e informe o <b>valor de tabela</b> (ou escolha a unidade) para ver a mensal.</div>';
  else{const lim=e.risco,w=Math.min(100,r.parcTotal/(lim*1.4)*100),mk=100/1.4;
    h+='<div class="big"><span>Mensal com a Girollar</span><b>'+brl(r.mensal)+"</b><small>"+s.nMensais+"x a partir de "+fmtD(r.dM)+'</small></div><div class="rows"><span>Entrada a parcelar</span><span>'+brl(r.entrada)+"</span><span>Sinal</span><span>"+brl(s.sinal)+"</span><span>Reforços</span><span>"+(s.nRef?s.nRef+"× "+brl0(s.vRef):"nenhum")+"</span><span>Documentação</span><span>"+(r.docVal?brl0(r.docVal):"Sem")+"</span><span>Pró-soluto</span><span>"+pct(r.pro)+' da tabela</span></div><div class="meter '+(r.parcTotal>lim?"bad":"")+'" style="padding-top:12px"><div class="t"><span>Parcelamento total <b style="color:var(--fg)">'+pct(r.parcTotal)+"</b></span><span>limite "+pct(lim,0)+'</span></div><div class="track"><i style="width:'+w+'%"></i><u style="left:'+mk+'%"></u></div></div><div class="alerts" style="padding-top:0">'+alerts+"</div>"}
  h+='<div class="go"><button class="btn primary" type="button" id="cGo"'+(ok?"":" disabled")+'>Usar na simulação</button><span class="small muted">Leva estes valores para uma nova simulação, onde você coloca o cliente e envia.</span></div></div>';
  $("cRes").innerHTML=h;
  $("cBarVal").textContent=ok?brl(r.mensal)+(s.nMensais?" × "+s.nMensais:""):"—";
  $("cBarLbl").textContent=ok?(r.bad?"⚠ "+r.al[0].t+(r.al.length>1?" (+"+(r.al.length-1)+")":""):"✓ Dentro das regras"):"Mensal";
  $("cBarInfo").className="c1 "+(ok?(r.bad?"bad":"ok"):"");$("cBarGo").disabled=!ok;
}
function cImport(btn){
  const s=cState();if(!(s.tabela>0&&s.emp))return;
  if(!cConfirm&&readState().cliente){cConfirm=true;const old=btn.textContent;btn.textContent="Toque de novo para substituir a simulação atual";setTimeout(()=>{cConfirm=false;btn.textContent=old},3500);return}
  cConfirm=false;const keep={corretor:$("corretor").value,imob:$("imob").value};
  const {calc,...base}=s;writeState({...blank(),...keep,...base});
  document.querySelectorAll(".f.req").forEach(f=>f.dataset.tried="");showSim();go(0);toast("Valores da calculadora levados para uma nova simulação")}
$("c_emp").addEventListener("change",()=>{csel={b:"",u:""};cSyncUnit();cRender()});
$("c_bloco").addEventListener("change",()=>{csel={b:$("c_bloco").value,u:""};cSyncUnit();cRender()});
$("c_unid").addEventListener("change",()=>{csel.u=$("c_unid").value;const un=csel.u?unitOf($("c_emp").value,csel.b,csel.u):null;if(un){$("c_tabela").value=num(un[1]);$("c_avaliacao").value=num(un[2])}cRender()});
$("calcView").addEventListener("input",ev=>{const i=ev.target;if(i.id==="c_vRef")cRefTouched=true;if(i.id==="c_tabela"||i.id==="c_avaliacao"){csel.u="";$("c_unid").value=""}cRender()});
$("calcView").addEventListener("click",ev=>{const t=ev.target,b=t.closest("[data-cstp]"),q=t.closest("[data-cq]"),d=t.closest("[data-cdoc]"),a=t.closest("[data-cav]");
  if(b){const r=compute(cState()),i=$(b.dataset.cstp),dd=+b.dataset.d,mx=b.dataset.cstp==="c_nMensais"?r.maxM:r.e.maxReforcos,v=(parseInt(i.value)||0)+dd;i.value=Math.max(+i.min||0,dd>0?Math.min(mx,v):v);cRender()}
  else if(q){$("c_nMensais").value=q.dataset.cq;cRender()}
  else if(d){cdoc=d.dataset.cdoc==="1";cRender()}
  else if(a){cav=a.dataset.cav==="1";cRender()}
  else if(t.id==="cGo")cImport(t)});
$("cBarGo").onclick=()=>cImport($("cBarGo"));
$("cBarInfo").onclick=()=>$("cRes").scrollIntoView({behavior:"smooth",block:"start"});
document.querySelectorAll("[data-cmoney]").forEach(i=>i.addEventListener("blur",()=>{i.value=i.value.trim()===""?"":num(parseMoney(i.value))}));
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{if(b.dataset.mode==="calc"){showView("calc");cRender()}else showSim()});

document.addEventListener("click",ev=>{const b=ev.target.closest("[data-info]");if(!b)return;const bx=$(b.dataset.info);bx.hidden=!bx.hidden;b.setAttribute("aria-expanded",!bx.hidden)});
/* início */
fillEmp();
const st=loadDraft();if(st===null)writeState(blank());
go(st||0);

(async()=>{
  if(!window.claude||!window.claude.use)return;
  window.claude.use("downloads").then(d=>{dl=d}).catch(()=>{});
  const user=await window.claude.use("user");
  if(user){try{canAdmin=!!(await user.canEdit())}catch(e){}}
  $("hCond").hidden=!canAdmin;$("hTab").hidden=!canAdmin;
  db=await window.claude.use("db");
  if(!db)return;
  db.doc("config/condicoes").onSnapshot(snap=>{if(!snap.exists)return;const d=snap.data();if(d&&Array.isArray(d.empreendimentos)&&d.empreendimentos.length){CONF=JSON.parse(JSON.stringify(d));if(!condEdit){fillEmp();render();if(!$("condView").hidden)renderCond()}}},()=>{});
})();
})();
</script>
</body></html>
